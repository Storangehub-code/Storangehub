[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Force CRM subdomain to the login page
[[redirects]]
  from = "/"
  to = "/login.html"
  status = 200
  force = true
  conditions = {Host = ["responsedx.storangehub.com"]}

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  conditions = {Host = ["responsedx.storangehub.com"]}

# Normal marketing site
[[redirects]]
  from = "/"
  to = "/marketing.html"
  status = 200
  force = true

[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200