[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# ===== MAIN DOMAIN (storangehub.com) =====
[[redirects]]
  from = "/"
  to = "/marketing.html"
  status = 200
  force = true
  conditions = {Host = ["storangehub.com", "www.storangehub.com"]}

[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 200
  force = true
  conditions = {Host = ["storangehub.com", "www.storangehub.com"]}

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  conditions = {Host = ["storangehub.com", "www.storangehub.com"]}

# ===== CRM SUBDOMAIN (responsedx.storangehub.com) =====
# Everything on the subdomain goes to the CRM app
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = true
  conditions = {Host = ["responsedx.storangehub.com"]}