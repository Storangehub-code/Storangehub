[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# CRM subdomain — root goes to login, everything else is SPA
[[redirects]]
  from = "/"
  to = "/login.html"
  status = 200
  force = true
  conditions = {Host = ["responsedx.storangehub.com"]}

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  conditions = {Host = ["responsedx.storangehub.com"]}

# Marketing site (everything else)
[[redirects]]
  from = "/"
  to = "/marketing.html"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200