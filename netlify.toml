[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  conditions = {Host = ["responsedx.storangehub.com"]}

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  conditions = {Host = ["storangehub.com", "www.storangehub.com"]}