[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "VITE_RESEND_KEY,VITE_SUPABASE_ANON_KEY,VITE_SUPABASE_URL,RESEND_KEY"

# Serve marketing page at root
[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

# Serve login page
[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 200

# Send everything else to the React CRM (served under /app)
[[redirects]]
  from = "/app/*"
  to = "/index.html"
  status = 200

# Fallback for SPA routes inside the CRM
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
