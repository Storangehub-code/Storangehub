[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# On the Response DX subdomain, root loads the CRM login
[[redirects]]
  from = "/"
  to = "/login.html"
  status = 200
  force = true
  conditions = {Host = ["responsedx.storangehub.com"]}

# Everything else on the subdomain is the SPA
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  conditions = {Host = ["responsedx.storangehub.com"]}

# Main site stays marketing
[[redirects]]
  from = "/"
  to = "/marketing.html"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200